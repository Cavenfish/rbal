[package]
name = "rbal"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.40"
clap = { version = "4.5.32", features = ["derive"] }
colored = "3.0.0"
crossterm = "0.29.0"
dirs = "6.0.0"
dotenv = "0.15.0"
ratatui = { version = "0.29.0", features = ["all-widgets"] }
rusqlite = { version = "0.34.0", features = ["bundled", "csvtab", "vtab"] }
